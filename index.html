<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guga Guga</title>
    <link rel="stylesheet" href="./styles/style.css" />
    <link rel="icon" type="image/x-icon" href="./img/magnus.png" />
  </head>
  <body>
    <header>
      <div class="logo">
        <img src="./img/magnus.png" alt="" />
        <div>
          <h1>Upador de Imagem</h1>
          <h1>Magnus Gallus</h1>
        </div>
      </div>
      <div><button id="changeTab">Visualizador</button></div>
    </header>
    <div class="overlay" id="overlay"></div>
    <div class="promptSenha" id="promptSenha">
      <img src="" id="image2" alt="">
      <h1>Digite a senha para enviar a imagem</h1>
      <input type="password" id="passInput">
      <button id="btnPassword">Subir imagem</button>
    </div>
    <section>
      <div class="image-display">
        <img
          src="https://i.pinimg.com/564x/3a/3d/4b/3a3d4b04d70cc293fadf195b4e1a7bcb.jpg"
          alt=""
          id="image"
        />
      </div>
      <div class="upload">
        <input type="file" id="fileInput" accept="image/*" />
        <label for="fileInput" id="fileLabel">Escolher imagem</label>
          <img src="" alt="" id="preview" />
          <button id="uploadButton">Subir imagem</button>
      </div>
    </section>
  </body>
</html>
<script type="module" src="./scripts/main.js"></script>
