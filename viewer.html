<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de Imagens</title>
    <link rel="stylesheet" href="./styles/viewer.css">
    <link rel="icon" type="image/x-icon" href="./img/magnus.png" />
</head>
<body>
    <header>
      <div class="logo">
        <img src="./img/magnus.png" alt="" />
        <div>
          <h1>Visualizador de Imagens</h1>
          <h1>Magnus Gallus</h1>
        </div>
      </div>
      <div><button id="changeTab">Upador</button></div>
    </header>
    <section>
        <div class="overlay" id="overlay"></div>
        <div class="mainDisplay" id="mainDisplay">
            <img src="" alt="" id="fullImage">
            <div>
                <button id="close">Fechar</button>
                <h1 id="key"></h1>
                <button id="delete">Deletar</button>
            </div>
        </div>
        <div class="selectDisplays" id="selectDisplays">

        </div>
    </section>
</body>
</html>
<script src="./scripts/viewer.js" type="module"></script>
