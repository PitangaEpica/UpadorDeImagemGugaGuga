<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de Imagens</title>
    <link rel="stylesheet" href="./styles/password.css">
    <link rel="icon" type="image/x-icon" href="./img/magnus.png" />
</head>
<body>
    <header>
      <div class="logo">
        <img src="./img/magnus.png" alt="" />
        <div>
          <h1>Visualizador de Imagens</h1>
          <h1>Magnus Gallus</h1>
        </div>
      </div>
      <div><button id="changeTab">Upador</button></div>
    </header>
    <section>
        <div class="password-container">
            <h2>Digite a senha para acessar as imagens</h2>
            <input type="password" id="passwordInput" placeholder="Senha">
            <button id="submitPassword">Enviar</button>
        </div>
    </section>
</body>
</html>
<script src="./scripts/password.js"></script>
